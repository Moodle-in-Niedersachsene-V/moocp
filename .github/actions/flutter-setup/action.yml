name: Flutter setup
description: Flutter, Systempakete und Abhängigkeiten für Prüfung, Tests und Desktop-Bauten
runs:
  using: composite
  steps:
    - name: Native Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev libayatana-appindicator3-dev libkeybinder-3.0-dev libx11-dev libxi-dev libxtst-dev
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Flutter 3.50.0 (Dart 3.14)
      # Action eines Dritten, auf den Commit gepinnt (v2.23.0): sie läuft vor jedem Bau.
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version: '3.50.0'
        channel: stable
        cache: false
    - name: Skills assets
      shell: bash
      run: python skills/build.py
    - name: Dependencies
      shell: bash
      run: flutter pub get --enforce-lockfile
