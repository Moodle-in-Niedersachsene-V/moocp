# Die Prüfungen, die jede Änderung durchlaufen muss (CONTRIBUTING.md, „Repository settings“).
# Die Namen der beiden Aufträge sind die Namen der erforderlichen Statusprüfungen
# im Regelsatz von `main`: nicht umbenennen, ohne den Regelsatz anzupassen.
name: Checks
on:
  # `edited`: Wird bei gestapelten Pull Requests die Basis auf `main` umgehängt,
  # läuft die Prüfung gegen die neue Basis neu. Kein `if:` an den Aufträgen: Ein
  # übersprungener Auftrag zählt als bestanden und überdeckte ein früheres Rot.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # Pull Requests: der neue Lauf ersetzt den alten. Pushes auf `main`: je Commit eine
  # eigene Gruppe, damit kein Commit ohne Prüfung bleibt (eine Nightly verlangt sie).
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyze:
    name: flutter analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/flutter-setup
      - run: flutter analyze
  test:
    name: flutter test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/flutter-setup
      - name: Tests of the CI scripts
        run: python -m unittest discover -s tool -p 'test_ci_*.py' -v
      - name: Complete test suite
        run: flutter test --concurrency 2 --reporter expanded
