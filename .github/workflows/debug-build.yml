# Debug-Bau mit Testbetrieb für Linux (E20, docs/agents/testing.md). Er läuft auf
# GitHub, damit die Entwicklungsrechner nicht unter dem Flutter-Bau leiden. Der
# Bau enthält den Testbetrieb (--dart-define=MOOCP_TESTBETRIEB=true) und ist nie
# für Lehrkräfte bestimmt; das Artefakt lebt drei Tage. Gebaut wird der gepushte
# Commit eines Zweigs `ci/debug-*`; keine Tests (die laufen im Zweig selbst), keine
# Zugangsdaten: Profile und Zugangsdateien kommen erst beim Start auf dem Rechner.
name: Debug build (Linux, Testbetrieb)
run-name: Debug build ${{ github.sha }}
on:
  push:
    branches: ['ci/debug-**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    if: github.repository == 'Moodle-in-Niedersachsene-V/moocp'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev libayatana-appindicator3-dev libkeybinder-3.0-dev libx11-dev libxtst-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: false
      - run: python skills/build.py
      - run: flutter pub get --enforce-lockfile
      - name: Debug build with test mode
        run: flutter build linux --debug --dart-define=MOOCP_TESTBETRIEB=true
      - name: Archive
        run: |
          bundle=build/linux/x64/debug/bundle
          : > "$bundle/testbetrieb"
          echo "${GITHUB_SHA}" > "$bundle/build-commit.txt"
          mkdir -p dist
          tar -czf dist/moocp-linux-debug-testbetrieb.tar.gz -C "$bundle" .
      - uses: actions/upload-artifact@v7
        with:
          name: moocp-linux-debug-testbetrieb
          path: dist/*
          if-no-files-found: error
          retention-days: 3
