# Bauten und Tests auf Anforderung, für Plattformen, die `Checks` nicht
# automatisch abdeckt (Windows, macOS) und für Release-Bundles. Linux-Prüfung
# und -Tests laufen für jeden Pull Request und jeden Push auf `main` schon in
# `Checks`; hier laufen sie für Linux nur, wenn sie dort für den Commit nicht
# ohnehin laufen (kein offener Pull Request).
name: Desktop builds
run-name: Desktop build (${{ github.event.head_commit.message || inputs.platform }})
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Plattformen (linux, windows, macos; mit Komma oder all)
        type: string
        default: linux
      task:
        description: Umfang
        type: choice
        options: [all, tests, builds]
        default: all
permissions:
  contents: read
jobs:
  select:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ci:')
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Open pull request for this commit
        id: covered
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          open=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.state == "open")] | length')
          echo "covered=$([ "$open" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - id: select
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          PLATFORM: ${{ inputs.platform }}
          TASK: ${{ inputs.task }}
          COVERED: ${{ steps.covered.outputs.covered }}
        run: echo "matrix=$(python tool/ci_bau.py --matrix)" >> "$GITHUB_OUTPUT"
  desktop:
    needs: select
    if: needs.select.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/flutter-setup
      - name: Analysis
        if: matrix.tests
        run: flutter analyze
      - name: Complete test suite
        if: matrix.tests
        run: flutter test --concurrency 2 --reporter expanded
      - name: Release build
        if: matrix.builds
        run: flutter build ${{ matrix.platform }} --release
      - name: Linux archive
        if: matrix.platform == 'linux' && matrix.builds
        run: |
          mkdir -p dist
          cp docs/icon/icon.png build/linux/x64/release/bundle/moocp.png
          tar -czf dist/moocp-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - name: Debian 13 runtime check
        if: matrix.platform == 'linux' && matrix.builds
        run: |
          docker run --rm -v "$PWD/build/linux/x64/release/bundle:/bundle:ro" debian:13 bash -euxc '
            apt-get update
            apt-get install -y libgtk-3-0t64 libsecret-1-0 libstdc++6 libayatana-appindicator3-1 libkeybinder-3.0-0 libxtst6 libegl1 libgles2 libgl1-mesa-dri xvfb xauth
            cd /bundle
            find . -type f \( -name "*.so" -o -name moocp \) -exec ldd {} \; > /tmp/ldd.txt
            cat /tmp/ldd.txt
            ! grep -q "not found" /tmp/ldd.txt
            set +e
            xvfb-run -a timeout 15s ./moocp --kein-update > /tmp/start.log 2>&1
            result=$?
            cat /tmp/start.log
            test "$result" = 124
          '
      - name: Windows archive
        if: matrix.platform == 'windows' && matrix.builds
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/moocp-windows-x64.zip
      - name: macOS archive
        if: matrix.platform == 'macos' && matrix.builds
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/moocp.app dist/moocp-macos-arm64.zip
      - name: Bundle artifact
        if: matrix.builds
        uses: actions/upload-artifact@v7
        with:
          name: moocp-${{ matrix.platform }}-${{ matrix.platform == 'macos' && 'arm64' || 'x64' }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
