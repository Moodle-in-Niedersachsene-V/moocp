# Baut alle fünf Pakete und veröffentlicht sie (E12, E24, E39).
#
# Zwei Kanäle:
#   nightly  Ein Stand von main als Vorabversion v<Version>-nightly.<JJJJMMTT>.<n>,
#            von Hand ("Run workflow") oder jede Nacht, wenn main neue Commits hat.
#   stable   Ein vorhandener Tag v<Version> (auf main oder release/x.y), als
#            normales Release "latest". Läuft im Environment "stable": Der andere
#            Maintainer bestätigt dort die Veröffentlichung.
#
# Alles Entscheiden steht in tool/ci_release.py (mit Tests); diese Datei ruft es auf.
# Jeder Lauf, der nicht veröffentlichen darf (anderer Zweig, Fork, "publish" aus),
# baut dieselben Pakete und lädt sie nur als Artefakte hoch: kein Tag, kein Release.
name: Release
run-name: Release ${{ inputs.channel || 'nightly' }} (${{ github.event_name }}${{ inputs.publish == false && ', nur Bau' || '' }})
on:
  push: # TEMPORARY for the dry runs of this PR, removed before the PR is finished
    branches: [ci/132-release-workflow]
  schedule:
    # Nicht zur vollen Stunde: Dort ist bei GitHub am meisten los (03:41 deutscher Zeit im Winter).
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Kanal (nightly = Stand von main, stable = Tag v<Version>)
        type: choice
        options: [nightly, stable]
        default: nightly
      publish:
        description: Veröffentlichen (aus = nur bauen und als Artefakte hochladen)
        type: boolean
        default: true
permissions:
  contents: read
# Ein Lauf je Ref zur Zeit: Zwei Nightlies am selben Tag vergeben sonst dieselbe Nummer.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      base_version: ${{ steps.plan.outputs.base_version }}
      version_suffix: ${{ steps.plan.outputs.version_suffix }}
      build_number: ${{ steps.plan.outputs.build_number }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Script tests
        run: python tool/test_ci_release.py -v
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          PUBLISH: ${{ inputs.publish }}
        run: python tool/ci_release.py plan --channel "$CHANNEL" --publish "${PUBLISH:-true}"
      - name: Release notes
        if: steps.plan.outputs.build == 'true'
        env:
          BASE_VERSION: ${{ steps.plan.outputs.base_version }}
          REQUIRE: ${{ steps.plan.outputs.publish == 'true' && '--require' || '' }}
        # Ohne Abschnitt in CHANGELOG.md scheitert ein veröffentlichender Lauf hier, vor den Bauten.
        run: python tool/ci_release.py notes --base-version "$BASE_VERSION" --out notes.md $REQUIRE
  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2022
          - platform: macos
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Native Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev libayatana-appindicator3-dev libkeybinder-3.0-dev libx11-dev libxi-dev libxtst-dev fakeroot xvfb xauth
      - name: NSIS
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
      - name: Flutter 3.50.0 (Dart 3.14)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: false
      # Die Nightly-Version kommt nur in die Arbeitskopie dieses Runners, in keinen Commit.
      - name: Nightly version
        if: needs.plan.outputs.version_suffix != ''
        env:
          BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
        run: python tool/ci_release.py set-version --version "$VERSION" --build "$BUILD_NUMBER"
      - name: Skills assets
        run: python skills/build.py
      - name: Dependencies
        run: flutter pub get --enforce-lockfile
      - name: Linux packages
        if: matrix.platform == 'linux'
        run: |
          bash tool/linux_installer.sh
          bash tool/linux_appimage.sh
          bash tool/linux_deb.sh
      - name: Version of the Linux build
        if: matrix.platform == 'linux'
        run: |
          out="$(xvfb-run -a build/linux/x64/release/bundle/moocp --version)"
          echo "moocp --version: $out"
          [[ "$out" == "$VERSION"* ]]
      - name: create_installer.bat keeps CRLF
        if: matrix.platform == 'windows'
        run: |
          # cmd liest Sprungmarken in Dateien mit LF nicht zuverlässig (installer/CLAUDE.md).
          test "$(tr -cd '\r' < create_installer.bat | wc -c)" = "$(wc -l < create_installer.bat)"
      - name: Windows installer
        if: matrix.platform == 'windows'
        shell: cmd
        env:
          # Analyse und Tests laufen in den Prüfungen von main, nicht noch einmal hier.
          MOOCP_OHNE_PRUEFUNG: '1'
          MOOCP_VERSION_ZUSATZ: ${{ needs.plan.outputs.version_suffix }}
        run: create_installer.bat
      - name: Version of the Windows build
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $out = (& build\windows\x64\runner\Release\moocp.exe --version | Out-String).Trim()
          Write-Host "moocp --version: $out"
          if (-not $out.StartsWith($env:VERSION)) { throw "Unexpected version: $out" }
      - name: macOS disk image
        if: matrix.platform == 'macos'
        run: bash tool/mac_dmg.sh
      - name: Version of the macOS build
        if: matrix.platform == 'macos'
        run: |
          out="$(build/macos/Build/Products/Release/moocp.app/Contents/MacOS/moocp --version)"
          echo "moocp --version: $out"
          [[ "$out" == "$VERSION"* ]]
      - name: Check packages
        run: python tool/ci_release.py check-assets --version "$VERSION" --platform ${{ matrix.platform }}
      - name: Packages
        uses: actions/upload-artifact@v7
        with:
          name: moocp-${{ matrix.platform }}
          path: installer/moocp_*
          if-no-files-found: error
          retention-days: 7
  publish-nightly:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.channel == 'nightly'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          pattern: moocp-*
          merge-multiple: true
          path: assets
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          BASE_VERSION: ${{ needs.plan.outputs.base_version }}
        run: |
          python tool/ci_release.py notes --base-version "$BASE_VERSION" --out notes.md --require
          python tool/ci_release.py publish --channel nightly --tag "$TAG" --version "$VERSION" --notes-file notes.md --dir assets
  # Wie publish-nightly, aber im Environment "stable": Der andere Maintainer bestätigt hier,
  # dass er die Nightly selbst lange genug benutzt hat (E39). Zwei Jobs statt eines, weil
  # `environment` nicht je nach Kanal ausbleiben kann.
  publish-stable:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.channel == 'stable'
    runs-on: ubuntu-24.04
    environment: stable
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          pattern: moocp-*
          merge-multiple: true
          path: assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          BASE_VERSION: ${{ needs.plan.outputs.base_version }}
        run: |
          python tool/ci_release.py notes --base-version "$BASE_VERSION" --out notes.md --require
          python tool/ci_release.py publish --channel stable --tag "$TAG" --version "$VERSION" --notes-file notes.md --dir assets
