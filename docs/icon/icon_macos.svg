<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Mac-Fassung von icon.svg im Raster von Apple: Die Fläche ist 824 × 824
       groß und sitzt 100 vom Rand, sonst wirkt das Symbol im Dock größer als
       die anderen. Inhalt wie icon.svg, nur verkleinert. Daraus entsteht
       icon_macos.png (cairosvg icon_macos.svg -o icon_macos.png) und mit
       flutter_launcher_icons das Symbol der Mac-App (pubspec.yaml). -->
